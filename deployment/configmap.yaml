apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  namespace: microservices
data:
  MICRONAUT_ENVIRONMENTS: "prod"
  AUTH_DATABASE_URL: "jdbc:postgresql://shared-posadskiy.e.aivencloud.com:25370/auth_db?sslmode=require"
  AUTH_DATABASE_NAME: "auth_db"
  AUTH_DATABASE_USER: "avnadmin"
  GITHUB_USERNAME: "posadskiy"
  JAEGER_ENDPOINT: "http://jaeger-collector.observability-stack:14268/api/traces"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_PROTOCOL: "smtp"
  EMAIL_AUTH: "true"
  EMAIL_STARTTLS_ENABLE: "true"
  EMAIL_DEBUG: "true"
  # Public auth base after Traefik strips /auth. Google/Apple redirect:
  # https://api.posadskiy.com/auth/oauth2/callback/{google|apple}
  OAUTH_REDIRECT_BASE_URL: "https://api.posadskiy.com/auth"
  # Empty: each app passes return_to. Kept so older images still resolve the placeholder.
  OAUTH_FRONTEND_REDIRECT_URL: ""
  OAUTH_ALLOWED_FRONTEND_REDIRECT_URLS: "https://repeaty.posadskiy.com/oauth/callback,https://costy.posadskiy.com/oauth/callback,https://grammarbar.com/oauth/callback"
